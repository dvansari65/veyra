name: Contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.15.1'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: pnpm run setup
      - run: pnpm check
        env:
          FOUNDRY_PROFILE: ci
      - run: pnpm demo
      - run: pnpm --filter @veyra/contracts deploy:dry
